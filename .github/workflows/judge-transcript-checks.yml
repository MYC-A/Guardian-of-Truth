name: Judge transcript CPU checks
on:
  push:
    branches: [judge-single-pass-20261013]
  workflow_dispatch:
jobs:
  cpu:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install pydantic jsonschema pyyaml pandas pyarrow
      - run: python -m unittest tests.test_transcript tests.test_judge_mechanical tests.test_judge_transcript_integration tests.test_judge_v3 -v
        env:
          PYTHONPATH: src:.
          PYTHONDONTWRITEBYTECODE: '1'
