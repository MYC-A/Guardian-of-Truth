name: Judge transcript CPU checks
on:
  push:
    branches: [judge-single-pass-20261013]
  workflow_dispatch:
jobs:
  cpu:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install pydantic jsonschema pyyaml pandas pyarrow
      - run: python -m pip install torch==2.10.0 --index-url https://download.pytorch.org/whl/cpu
      - run: python -m pip install transformers==5.8.0 safetensors huggingface_hub
      - run: python scripts/fetch_judge_encoder.py --output models/encoder
      - run: python -m unittest tests.test_transcript tests.test_judge_mechanical tests.test_judge_transcript_integration tests.test_judge_v3 tests.test_judge_stage_rows tests.test_judge_u2 tests.test_u2_action_policy tests.test_judge_build_mode tests.test_evidence_packer tests.test_judge_blind_review tests.test_judge_blind_review_integration -v
        env:
          PYTHONPATH: src:.
          PYTHONDONTWRITEBYTECODE: '1'
          GUARDIAN_ENCODER_DIR: models/encoder
          GUARDIAN_REQUIRE_ENCODER: '1'
