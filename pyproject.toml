[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "guardian-truth"
version = "0.2.0"
description = "Evidence-based contextual hallucination checks"
requires-python = ">=3.10"
dependencies = []

[project.scripts]
guardian-predict = "guardian_truth.cli:main"

[project.optional-dependencies]
data = ["pandas>=2", "pyarrow>=15"]
dev = ["pytest>=8,<9", "pytest-asyncio>=0.25,<1"]
semantic-v1 = [
  "compressed-tensors==0.15.0",
  "transformers==5.16.1",
  "sentence-transformers==6.0.1",
  "peft==0.21.0",
  "accelerate>=1",
  "langextract==1.7.0",
]
# Kept separate from the ModelScope profile. GLiNER2 is intentionally absent:
# it lives in its own Transformers-4.x sidecar environment.
semantic-v1-colab = [
  "compressed-tensors==0.15.0",
  "transformers==5.17.0",
  "sentence-transformers==6.0.1",
  "accelerate>=1",
  "langextract==1.7.0",
]

[tool.pytest.ini_options]
asyncio_default_fixture_loop_scope = "function"

[tool.setuptools.packages.find]
where = ["src"]
