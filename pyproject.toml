[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "guardian-truth"
version = "0.1.0"
description = "Evidence-based contextual hallucination checks"
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
data = ["pandas>=2", "pyarrow>=15"]

[tool.setuptools.packages.find]
where = ["src"]
