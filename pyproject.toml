[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "guardian-truth"
version = "0.2.0"
description = "Evidence-based contextual hallucination checks"
requires-python = ">=3.10"
dependencies = []

[project.scripts]
guardian-predict = "guardian_truth.cli:main"

[project.optional-dependencies]
data = ["pandas>=2", "pyarrow>=15"]

[tool.setuptools.packages.find]
where = ["src"]
