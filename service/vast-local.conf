[program:guardian_research]
directory=/workspace/guardian/repos/hybrid-service-worktree
command=/bin/bash /workspace/guardian/repos/hybrid-service-worktree/service/vast-local.sh
environment=PROC_NAME="%(program_name)s",GUARDIAN_CONFIG="structural-v02"
autostart=true
autorestart=unexpected
startsecs=3
stopasgroup=true
killasgroup=true
stdout_logfile=/workspace/guardian/results/hybrid_service/supervisor.log
stdout_logfile_maxbytes=10485760
stdout_logfile_backups=2
redirect_stderr=true

# Research endpoint is PRIVATE on loopback. No portal/Caddy/public port entry.
# Change GUARDIAN_CONFIG only after the sealed comparison selects a default.
